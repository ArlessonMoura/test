<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atividade de Git</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body  class="flexbox flexbox-center">
        <header>
            
        </header>

        <main>
             <div class="janela-celular flexbox flexbox-column"> <!-- Janela Booking -->
                <!-- Status Bar -->
                <div class="flexbox status-bar flexbox-justify-space-between">

                    <div class="img-container-h">
                        <img src="assets/images/icons/top-bar/area-icon.png" alt="area-icon">
                    </div>

                    <p class="flexbox flexbox-column flexbox-center height-100pct">
                        3:35 PM
                    </p>

                    <div class="img-container-h">
                        <img src="assets/images/icons/top-bar/battery-icon.png" alt="battery-icon">
                    </div>
                </div>

                <!-- Conteudo Principal -->
                <div class="flexbox flexbox-column flexbox-center flexbox-justify-start height-100pct">
                    
                    <!-- Topo / titulo da página -->
                    <div class="flexbox flexbox-center">
                        <div>
                            <img src="assets/images/icons/booking/return-arrow.png" alt="return-arrow">
                        </div>

                        <h2 class="font-color-primary-black item-get-max-space">
                            Book a Seat
                        </h2>
                    </div>
                    
                    <!-- Seleção de individual ou em grupo -->
                    <div class="flexbox flexbox-center bg-primary-gray paddin-5px border-radius-10px margin-right-left-5pct">
                            <div class="flexbox flexbox-center bg-white border-5px border-radius-10px width-100pct">
                                <p class="font-color-primary-black">
                                    individual
                                </p>
                            </div>
                            
                            <div class="flexbox flexbox-center bg-primary-gray border-5px border-radius-10px width-100pct">
                                <p class="font-color-primary-blue">
                                    Group
                                </p>
                            </div>
                    </div>

                    <!-- Informação de lugares livres / ocupados -->
                    <div class="flexbox flexbox-column">
                        <h2 class="paddin-10px">
                            Available Seats
                        </h2>

                        <div class="flexbox flexbox-center flexbox-gap-5pct paddin-right-left-10pct">
                            <div class="flexbox flexbox-column flexbox-itens-center paddin-10px bg-green border-radius-10px width-100pct">
                                <h2 class="font-color-green">
                                    4
                                </h2>

                                <p class="font-color-green">
                                    Available
                                </p>
                            </div>

                            <div class="flexbox flexbox-column flexbox-itens-center paddin-10px bg-red border-radius-10px width-100pct">
                                <h2 class="font-color-red">
                                    0
                                </h2>

                                <p class="font-color-red">
                                    Occupied
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Locais para escolha -->
                    <div class="flexbox flexbox-column">
                        <div class="flexbox paddin-5pct">
                            <div class="flexbox flexbox-gap-5pct width-100pct">
                                <div class="img-container-h">
                                    <img src="assets/images/icons/booking/seat-icon.png" alt="seat-icon">
                                </div>

                                <div class="flexbox flexbox-center flexbox-column">
                                    <h4 class="font-color-primary-black">
                                        Seat 1
                                    </h4>

                                    <p class="font-color-secundary-blue">
                                        10:00 AM - 12:00 PM
                                    </p>
                                </div>
                            </div>

                            <div class="flexbox width-25pct">
                                <button class="bg-primary-gray border-radius-10px width-100pct">
                                    <h3 class="font-color-primary-black">
                                        Book
                                    </h3>
                                </button>
                            </div>
                        </div>

                        <div class="flexbox paddin-5pct">
                            <div class="flexbox flexbox-gap-5pct width-100pct">
                                <div class="img-container-h">
                                    <img src="assets/images/icons/booking/seat-icon.png" alt="search-icon">
                                </div>

                                <div class="flexbox flexbox-center flexbox-column">
                                    <h4 class="font-color-primary-black">
                                        Seat 2
                                    </h4>

                                    <p class="font-color-secundary-blue">
                                        12:00 PM - 2:00 PM
                                    </p>
                                </div>
                            </div>

                            <div class="flexbox width-25pct">
                                <button class="bg-primary-gray border-radius-10px width-100pct">
                                    <h3 class=" font-color-primary-black">
                                        Book
                                    </h3>
                                </button>
                            </div>
                        </div>

                        <div class="flexbox paddin-5pct">
                            <div class="flexbox flexbox-gap-5pct width-100pct">
                                <div class="img-container-h">
                                    <img src="assets/images/icons/booking/seat-icon.png" alt="seat-icon">
                                </div>

                                <div class="flexbox flexbox-center flexbox-column">
                                    <h4 class="font-color-primary-black">
                                        Seat 3
                                    </h4>

                                    <p class="font-color-secundary-blue">
                                        2:00 PM - 4:00 PM
                                    </p>
                                </div>
                            </div>

                            <div class="flexbox width-25pct">
                                <button class="bg-primary-gray border-radius-10px width-100pct">
                                    <h3 class="font-color-primary-black">
                                        Book
                                    </h3>
                                </button>
                            </div>
                        </div>

                        <div class="flexbox paddin-5pct">
                            <div class="flexbox flexbox-gap-5pct width-100pct">
                                <div class="img-container-h">
                                    <img src="assets/images/icons/booking/seat-icon.png" alt="seat-icon">
                                </div>

                                <div class="flexbox flexbox-center flexbox-column">
                                    <h4 class="font-color-primary-black">
                                        Seat 4
                                    </h4>

                                    <p class="font-color-secundary-blue">
                                        4:00 PM - 6:00 PM
                                    </p>
                                </div>
                            </div>

                            <div class="flexbox width-25pct">
                                <button class="bg-primary-gray border-radius-10px width-100pct">
                                    <h3 class="font-color-primary-black">
                                        Book
                                    </h3>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Botton nav -->
                <div class="flexbox botton-nav flexbox-justify-space-evenly">
                    
                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Primeiro elemento - Home-->
                        <div class="img-container-h">
                            <img src="assets/images/icons/bottom-menu/house-unselect.png" alt="house-icon">
                        </div>
                        
                        <p class="font-color-secundary-blue">
                            Home
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Segundo elemento - Search-->
                        <div class="img-container-h">
                            <img src="assets/images/icons/bottom-menu/search-unselect.png" alt="search-icon">
                        </div>

                        <p class="font-color-secundary-blue">
                            Search
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Terceiro elemento - My Bookings-->
                        <div class="img-container-h">
                            <img src="assets/images/icons/bottom-menu/bookings-select.png" alt="bookings-ico">
                        </div>

                        <p class="font-color-primary-blue">
                            My Bookings
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Quarto elemento - Help-->
                        <div class="img-container-h">
                            <img src="assets/images/icons/bottom-menu/question-unselect.png" alt="">
                        </div>

                        <p class="font-color-secundary-blue">
                            Help
                        </p>
                    </div>
                </div>

             </div>
        </main>

        <footer>

        </footer>
    </body>
</html>
