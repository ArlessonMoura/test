<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atividade de Git</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body  class="flexbox flexbox-center">
        <header>
            
        </header>

        <main>
             <div class="janela-celular flexbox flexbox-column flexbox-justify-space-between"> <!--Janela Home-->
                <!-- Status Bar -->
                <div class="flexbox status-bar flexbox-justify-space-between">

                    <div class="img-container">
                        <img src="assets/images/icons/top-bar/area-icon.png" alt="area-icon">
                    </div>

                    <p class="flexbox flexbox-column flexbox-center height-100pct">
                        8:28 PM
                    </p>

                    <div class="img-container">
                        <img src="assets/images/icons/top-bar/battery-icon.png" alt="battery-icon">
                    </div>
                </div>
                <!-- Conteudo Principal -->
                <div class="flexbox flexbox-column flexbox-center height-100pct">
                    <!-- Primeiros Títulos -->
                    <div class="flexbox flexbox-column flexbox-itens-center">
                        <h2 class="font-color-primary-black">
                            Library Seat Booking
                        </h2>

                        <h1 class="font-color-secundary-blue">
                            Find Your Perfect Study Spot
                        </h1>

                        <p class="font-text-color-secundary-blue">
                            Reserve your ideal study space with ease
                        </p>
                    </div>
                    <!-- Container das imagens de exemplos de locais de estudo -->
                    <div>
                        <div class="flexbox overflow-hidden"> 
                            <div class="img-container">
                                <img src="assets/images/scenarios/modern-library.png" alt="modern-library">
                            </div>

                            <div class="img-container">
                                <img src="assets/images/scenarios/quiet-study-room.png" alt="quiet-study-room">
                            </div>
                        </div>
                    </div>
                    <!-- Botão de disponibilidade -->
                     <div>
                        <button class="button-bg-blue">
                            Check Availability / Book Seat
                        </button>
                     </div>
                </div>
                <!-- Botton nav -->
                <div class="flexbox botton-nav flexbox-justify-space-evenly">
                    
                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Primeiro elemento - Home-->
                        <div class="img-container">
                            <img src="assets/images/icons/bottom-menu/house.png" alt="house-icon">
                        </div>
                        
                        <p class="font-color-primary-blue">
                            Home
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Segundo elemento - Search-->
                        <div class="img-container">
                            <img src="assets/images/icons/bottom-menu/search.png" alt="search-icon">
                        </div>

                        <p class="font-text-color-secundary-blue">
                            Search
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Terceiro elemento - My Bookings-->
                        <div class="img-container">
                            <img src="assets/images/icons/bottom-menu/bookings.png" alt="bookings-ico">
                        </div>

                        <p class="font-text-color-secundary-blue">
                            My Bookings
                        </p>
                    </div>

                    <div class="flexbox flexbox-column flexbox-center flexbox-itens-center"> <!--Quarto elemento - Help-->
                        <div class="img-container">
                            <img src="assets/images/icons/bottom-menu/question.png" alt="">
                        </div>

                        <p class="font-text-color-secundary-blue">
                            Help
                        </p>
                    </div>
                </div>

             </div>
        </main>

        <footer>

        </footer>
    </body>
</html>
